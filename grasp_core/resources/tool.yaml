defaults:
  force_object_z: true
  forced_object_z_m: 0.65
  pregrasp_distance_m: 0.05
  lift_distance_m: 0.08
  approach_axis: z
  approach_sign: -1.0
  use_flowpose_grasp_rotation: false
  use_box_z_symmetry_grasp_policy: true
  ik_grasp_tcp_offset_m: [-0.0, 0.0, -0.0]
  ik_pregrasp_extra_offset_m: [0.0, 0.0, 0.0]
  ik_orientation_quat: [0.0, 0.0, 0.0, 1.0]
  ik_downward_tilt_left_deg: -45.0
  ik_downward_tilt_right_deg: 45.0
  ik_downward_tilt_axis: z
  ik_downward_tilt_y_left_deg: 55.0
  ik_downward_tilt_y_right_deg: 55.0
  ik_downward_tilt_frame: local
  visualize_grasp_path:   False
  save_joint_trajectory_csv: False
  # Show network pose/size before long-object axis normalization and grasp policy.
  show_raw_flowpose_window: False

templates:
  saw:
    pick:
    - action_name: pick
      arm: left
      rotation_constraint: [100, 100, 100]
      pose_relative: 
      - [-0.01, -0.01, 0.2, 0.171010, 0.171010, -0.03015, 0.96984]
      - [-0.01, -0.01, 0.13, 0.171010, 0.171010, -0.03015, 0.96984]
      - [-0.01, -0.01, 0.04, 0.171010, 0.171010, -0.03015, 0.96984]
      - [-0.01, -0.01, 0.2, 0.171010, 0.171010, -0.03015, 0.96984]
      gripper_state: [0.0, 0.0, 0.0, 1.0]
      time: [0.0, 0.1, 0.2, 0.3]

    - action_name: pick
      arm: right
      rotation_constraint: [100, 100, 100]
      pose_relative: 
      - [-0.01, 0.01, 0.2, -0.171010, 0.171010, 0.03015, 0.96984]
      - [-0.01, 0.01, 0.13, -0.171010, 0.171010, 0.03015, 0.96984]
      - [-0.01, 0.01, 0.04, -0.171010, 0.171010, 0.03015, 0.96984]
      - [-0.01, 0.01, 0.2, -0.171010, 0.171010, 0.03015, 0.96984]
      gripper_state: [0.0, 0.0, 0.0, 1.0]
